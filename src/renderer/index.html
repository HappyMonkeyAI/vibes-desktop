<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vibes Desktop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Synchronous: sets Arco's light theme on <html> before first paint, so no
      // dark-mode flash. A future theme toggle flips both attributes (zerogterm pattern).
      document.documentElement.setAttribute('arco-theme', 'light');
      document.documentElement.setAttribute('data-theme', 'light');
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
